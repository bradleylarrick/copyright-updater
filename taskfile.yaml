version: '3'

tasks:
  default:
    desc: List all available tasks
    cmds:
      - task --list
    silent: true

  tidy:
    desc: Clean up Go modules
    cmds:
      - go mod tidy
      - go mod verify

  fmt:
    desc: Format Go code
    cmds:
      - go fmt . ./handlers

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run
    deps: [fmt]

  test:
    desc: Run unit tests with race detection and coverage
    cmds:
      - go test -v -coverprofile=coverage.out ./...

  coverage:
    desc: View test coverage in the browser
    cmds:
      - go tool cover -html=coverage.out -o coverage.html
    deps: [test]

  build:
    desc: Build the Go binary
    cmds:
      - echo "Building {{.OS}} binary"
      - go build
    deps: [tidy]

  # run:
  #   desc: Build and run the application
  #   cmds:
  #     - go run {{.MAIN_PATH}}

  clean:
    desc: Remove build artifacts and cache files
    cmds:
      - rm -f copyright *.exe coverage.*
